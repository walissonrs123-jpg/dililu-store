name: Publish Dililu (DNS disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dililu-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'walissonrs123-jpg/dililu-store' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Build static export
        run: |
          npm ci --no-fund
          npm run build
      - name: Prepare browser validation
        run: |
          npm install --prefix "$RUNNER_TEMP/dililu-browser" --no-save --package-lock=false playwright@1.58.2
          node "$RUNNER_TEMP/dililu-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Assume Dililu role through OIDC
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: arn:aws:iam::320169806724:role/dililu-github-deploy
          aws-region: us-east-1
          allowed-account-ids: '320169806724'
          role-session-name: dililu-${{ github.run_id }}
          role-duration-seconds: 3600
          unset-current-credentials: true
      - name: Confirm assumed role
        shell: bash
        run: |
          set -euo pipefail
          identity="$(aws sts get-caller-identity --query Arn --output text)"
          case "$identity" in
            arn:aws:sts::320169806724:assumed-role/dililu-github-deploy/*) ;;
            *) echo 'Unexpected AWS identity'; exit 1 ;;
          esac
          echo 'OIDC identity confirmed.'
      - name: Upload static export to Dililu S3
        run: python3 scripts/publish-static.py
      - name: Invalidate Dililu distribution and wait
        shell: bash
        run: |
          set -euo pipefail
          invalidation_id="$(aws cloudfront create-invalidation --distribution-id E1EZ9JK9Q7UT7V --paths '/*' --query Invalidation.Id --output text)"
          echo "Invalidation ID: $invalidation_id"
          aws cloudfront wait invalidation-completed --distribution-id E1EZ9JK9Q7UT7V --id "$invalidation_id"
          echo 'Invalidation completed.'
      - name: Validate CloudFront desktop and mobile
        run: PLAYWRIGHT_ROOT="$RUNNER_TEMP/dililu-browser" node scripts/smoke-cloudfront.mjs
    # No environment: the approved trust uses the main branch subject.
    # Only PutObject, CreateInvalidation and GetInvalidation; no deletions or DNS.
